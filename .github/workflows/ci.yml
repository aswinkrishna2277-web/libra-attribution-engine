name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check cli.py benchmarks/corpus.py benchmarks/run_benchmark.py benchmarks/test_benchmark.py
      - name: Core tests
        run: pytest test_libra.py -q
      - name: Install app extra and run full suite
        run: |
          pip install -e ".[app]"
          pytest test_libra.py -q
      - name: CLI smoke test
        run: |
          libra --version
          libra demo --format json | python -c "import json,sys; d=json.load(sys.stdin); assert d['allocations'], 'no allocations'"
      - name: Benchmark (quick smoke + regression tests)
        run: |
          python benchmarks/run_benchmark.py --quick
          cd benchmarks && pytest test_benchmark.py -q
