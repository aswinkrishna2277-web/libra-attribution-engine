[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libra-attribution-engine"
version = "0.2.0"
description = "Deterministic, reproducible apportionment of a fixed compensation pool across a known corpus of works (reference implementation of the Libra Attribution Standard)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aswin Krishna" }]
keywords = ["copyright", "attribution", "allocation", "collective-licensing", "reproducibility"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
libra = "cli:main"

[project.urls]
Repository = "https://github.com/aswinkrishna2277-web/libra-attribution-engine"

[tool.setuptools]
py-modules = ["libra_engine", "cli", "benchmark"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
